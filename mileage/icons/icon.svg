<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12996B"/>
      <stop offset="1" stop-color="#075C40"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- winding route -->
  <path d="M120 392 C 120 300, 250 320, 250 250 S 380 190, 392 120" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="58" stroke-linecap="round" transform="translate(0 8)"/>
  <path d="M120 392 C 120 300, 250 320, 250 250 S 380 190, 392 120" fill="none" stroke="url(#road)" stroke-width="58" stroke-linecap="round"/>
  <path d="M120 392 C 120 300, 250 320, 250 250 S 380 190, 392 120" fill="none" stroke="#0B7A55" stroke-width="7" stroke-linecap="round" stroke-dasharray="22 20"/>
  <!-- start and end pins -->
  <circle cx="120" cy="392" r="42" fill="#FFFFFF"/>
  <circle cx="120" cy="392" r="18" fill="#0B7A55"/>
  <circle cx="392" cy="120" r="42" fill="#FFFFFF"/>
  <circle cx="392" cy="120" r="18" fill="#0B7A55"/>
</svg>
