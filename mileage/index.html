<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mileage</title>
  <meta name="description" content="A fast, private mileage log for iPhone. Log a trip in two taps, track your deduction, export for taxes. Works offline; your data never leaves your device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mileage">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/trips.css">
  <link rel="stylesheet" href="./css/entry.css">
  <link rel="stylesheet" href="./css/summary.css">
  <link rel="stylesheet" href="./css/settings.css">
</head>
<body>
  <div id="top-bar" class="top-bar"><a class="top-bar-back" hidden></a><span class="top-bar-title" aria-hidden="true"></span></div>
  <main id="tab-root" class="tab-root" tabindex="-1"></main>
  <nav id="tab-bar" class="tab-bar-wrap" aria-label="Main"></nav>
  <div id="sheet-root" class="sheet-root" hidden></div>
  <div id="alert-root" class="alert-root" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <noscript><div class="page"><div class="card">Mileage needs JavaScript to run.</div></div></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
